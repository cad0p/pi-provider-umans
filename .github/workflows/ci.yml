name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 11 — same install path pi uses for this extension, so an
      # unapproved build script (ERR_PNPM_IGNORED_BUILDS) fails CI instead
      # of breaking `pi update` locally.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # CLN11-6/CLN12-8: node floor is >=20.10, but pnpm 11 needs 22.13+
          # and pi-coding-agent 0.84.1 engines pin >=22.19.0 — exercise pi's
          # minimum rather than the package's own (looser) floor.
          node-version: "22.19"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Selfcheck
        run: pnpm test
